{% extends "base.html" %}

{% block title %}Login - Smart Attendance System{% endblock %}

{% block head %}
<style>
    .login-container {
        min-height: calc(100vh - 56px);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        border-radius: 15px;
        overflow: hidden;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center">
                <h4><i class="fas fa-user-lock me-2"></i>Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Login with Password
                        </button>
                    </div>
                </form>
                
                <hr class="my-3">
                
                <!-- Biometric Login Option -->
                <div class="biometric-option d-grid mb-2">
                    <button type="button" id="biometric-login-btn" class="btn btn-success">
                        <i class="fas fa-fingerprint me-2"></i>Login with Fingerprint/Biometric
                    </button>
                </div>
                
                <!-- Status container for biometric login -->
                <div id="login-status" class="d-none"></div>
            </div>
            <div class="card-footer text-center text-muted">
                <small><i class="fas fa-map-marker-alt me-1"></i>Location verification required - College premises only</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Initialize WebAuthn manager when page loads  
document.addEventListener('DOMContentLoaded', function() {
    // WebAuthnManager automatically handles all biometric buttons
    // No duplicate event handlers needed here
});

// All biometric authentication is now handled by WebAuthnManager class
// No duplicate functions needed - this prevents "request pending" errors
</script>
{% endblock %}
