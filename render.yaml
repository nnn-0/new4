services:
  - type: web
    name: smart-attendance-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///attendance.db"
      - key: SESSION_SECRET
        value: "your-super-secret-key-change-this-123"
      - key: PYTHON_VERSION
        value: "3.9.19"
